name: ragu

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  ragu:
    if: |
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (
        contains(github.event.comment.body, ' /nik ') ||
        startsWith(github.event.comment.body, '/nik ') ||
        github.event.comment.body == '/nik' ||
        contains(github.event.comment.body, ' /ragu ') ||
        startsWith(github.event.comment.body, '/ragu ') ||
        github.event.comment.body == '/ragu'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run ragu
        run: bun github/index.ts
        env:
          MODEL: minimax-coding-plan/MiniMax-M3
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          RAGU_PERMISSION: '{"*": "allow"}'
          RAGU_TERMINAL: "1"
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
