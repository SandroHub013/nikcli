name: ade-auto-release

# Every 12 hours, releases ADE if `feat/ade` has something a user would notice
# since the last `ade-v*` tag. The rules are in `packages/ade/CONTRIBUTING.md`
# and `packages/ade/src/update/release-plan.ts`; in short:
#
#   - feat → minor, fix / perf / revert → patch, `!` or BREAKING CHANGE → major
#     (minor while ADE is 0.x); docs, tests, chores and refactors never release;
#   - `[skip release]` in a commit, or a merged pull request labelled
#     `release:skip`, keeps it from causing one; `release:major` forces a major;
#   - the newest commit must be at least `min_age_hours` old;
#   - `ade-checks` must pass on that exact commit;
#   - no `ade-release` run may still be building.
#
# The tag is pushed with GITHUB_TOKEN, and a tag pushed that way starts no
# workflow, so `ade-release` is called here directly instead of relying on
# its tag trigger.
#
# GitHub only runs `schedule` from the repository's default branch.
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
    inputs:
      min_age_hours:
        description: "Minimum age of the newest commit, in hours"
        default: "2"
        type: string
      dry_run:
        description: "Plan and check, but do not tag or release"
        default: false
        type: boolean

concurrency:
  group: ade-auto-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: github.repository == 'SandroHub013/nikcli'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/ade
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pull request labels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Commits one pull request at a time, over REST: asking GraphQL for the
          # commits of a hundred pull requests at once exceeds its node limit.
          for label in release:skip release:major; do
            : > "${label#release:}-shas.txt"
            for pr in $(gh pr list --repo "$GITHUB_REPOSITORY" --base feat/ade --state merged --label "$label" \
              --limit 100 --json number --jq '.[].number'); do
              gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr/commits" --jq '.[].sha' >> "${label#release:}-shas.txt"
            done
          done

      # Runs, not drafts: a read-only token cannot see draft releases, and a
      # draft left by a failed build must not block every release after it.
      - name: A release still building
        id: busy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUSY=0
          for status in queued in_progress waiting; do
            N="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ade-release.yml --status "$status" \
              --limit 20 --json databaseId --jq 'length')"
            BUSY=$((BUSY + N))
          done
          echo "drafts=$BUSY" >> "$GITHUB_OUTPUT"

      # The base of the plan is the newest tag whose release is public. The tag is pushed before the
      # release is built, so one whose build failed is still there, with a draft: counted as the base,
      # the next plan said "nothing to release" and the lost commits never went out. A listing that
      # fails fails the step: the plan must not fall back to counting every tag.
      - name: Public releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName' > published-tags.txt
          echo "public releases: $(grep -c '^ade-v' published-tags.txt || true) ade-v*"

      - name: Plan
        id: plan
        shell: bash
        env:
          MIN_AGE: ${{ inputs.min_age_hours || '2' }}
          DRAFTS: ${{ steps.busy.outputs.drafts }}
        run: |
          set -euo pipefail
          if [ "$DRAFTS" != "0" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "an ADE release is still building; trying again next time" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bun packages/ade/script/release-plan.ts plan --min-age-hours "$MIN_AGE" \
            --skip-shas skip-shas.txt --major-shas major-shas.txt --published-tags published-tags.txt | tee plan.txt
          {
            echo "### ADE auto-release"
            echo
            sed 's/^/    /' plan.txt
            if [ -f release-notes.md ]; then echo; cat release-notes.md; fi
          } >> "$GITHUB_STEP_SUMMARY"

  checks:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ade-checks.yml
    with:
      ref: ${{ needs.plan.outputs.sha }}

  tag:
    needs: [plan, checks]
    if: needs.plan.outputs.release == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tagged: ${{ steps.tag.outputs.tagged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      # GITHUB_TOKEN may not create a ref whose workflows differ from the
      # default branch's, so a push to feat/ade that changed a workflow while
      # the checks ran would get the tag refused. The checked commit is then no
      # longer the newest anyway: leave it to the next run.
      - name: Tag
        id: tag
        shell: bash
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD="$(git ls-remote origin refs/heads/feat/ade | cut -f1)"
          if [ "$HEAD" != "$SHA" ]; then
            echo "feat/ade moved from $SHA to $HEAD during the checks; releasing next time" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The plan counted only public releases, so a tag with this name that is already there belongs to
          # a release that never went public (a failed build): it and its draft are cleared, and the tag is
          # made again on the commit that was checked. A public release is never touched.
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            # Only «release not found» means there is no release. Any other error (network, rate limit) stops
            # here: taking it for «none» would clear the tag and leave a draft behind with the old notes.
            if VIEW="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>&1)"; then
              STATE="$VIEW"
            elif grep -qi 'release not found' <<<"$VIEW"; then
              STATE=none
            else
              echo "could not read the release of $TAG: $VIEW" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            if [ "$STATE" = "false" ]; then
              echo "$TAG is a public release already; not touching it" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            if [ "$STATE" = "true" ]; then gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes; fi
            git push origin ":refs/tags/$TAG"
            echo "cleared $TAG, left by a release that never went public" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "ADE ${TAG#ade-v}"
          git push origin "$TAG"
          echo "tagged=true" >> "$GITHUB_OUTPUT"

  release:
    needs: [plan, tag]
    if: needs.tag.outputs.tagged == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/ade-release.yml
    with:
      tag: ${{ needs.plan.outputs.tag }}
    secrets: inherit
