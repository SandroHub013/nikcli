name: ade-release

# Releases ADE for macOS, Windows and Linux from a tag.
# ci-pipeline also calls this with attach_only to add installers to its existing
# v* release, without publishing or changing either app's updater manifest.
#
#   git tag ade-v1.2.3 && git push origin ade-v1.2.3
#
# The release is created as a draft, every platform uploads into it, and only
# when all of them have succeeded is it published. Publishing is what running
# copies of ADE watch for (`packages/ade/src/update/watch.ts` reads the non-draft
# `ade-v*` releases of this repository), so a half-built release never reaches
# the bell.
#
# The version comes from the tag and is written into the Tauri config at build
# time; `tauri.conf.json` keeps `0.0.0`, which ADE treats as a dev build that
# is never offered updates.
#
# Installed copies update themselves: every build is also signed with ADE's
# updater key (secret ADE_UPDATER_PRIVATE_KEY, public half in tauri.conf.json),
# and once the release is published a `latest.json` listing those signed
# bundles is uploaded to it and to the fixed `ade-updater` release, which is
# the endpoint the app asks. The manifest is written only after publishing, so
# no app is ever pointed at a draft's assets.
#
# macOS bundles are ad-hoc signed and not notarized: a downloaded copy needs
# right-click → Open once. Windows installers are unsigned (SmartScreen asks).
on:
  push:
    tags:
      - "ade-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. ade-v1.2.3"
        required: true
        type: string
      attach_only:
        description: "Attach installers to an existing nikcli v* release; leave updater feeds untouched"
        required: false
        type: boolean
        default: false
  # `ade-auto-release` tags with GITHUB_TOKEN, which starts no workflow, and
  # calls this one directly.
  workflow_call:
    inputs:
      tag:
        description: "Existing tag to release, e.g. ade-v1.2.3"
        required: true
        type: string
      attach_only:
        description: "Attach installers to an existing nikcli v* release; leave updater feeds untouched"
        required: false
        type: boolean
        default: false

concurrency:
  group: ade-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  draft:
    if: >-
      github.repository == 'SandroHub013/nikcli' ||
      ((github.repository == 'nikomatt69/nikcli' || github.repository == 'nikcli/nikcli') && inputs.attach_only)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Version from tag
        id: version
        shell: bash
        env:
          ATTACH_ONLY: ${{ inputs.attach_only }}
        run: |
          set -euo pipefail
          PREFIX="ade-v"
          if [ "$ATTACH_ONLY" = "true" ]; then PREFIX="v"; fi
          VERSION="${TAG#"$PREFIX"}"
          if [[ "$TAG" != "$PREFIX"* ]] || ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag '$TAG' is not ${PREFIX}<major>.<minor>.<patch>"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify existing nikcli release
        if: inputs.attach_only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' | grep -qx false

      - name: Create draft release
        if: ${{ !inputs.attach_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAME="$(jq -r .name packages/ade/brand.json)"
          jq -e '.name | type == "string" and length > 0' packages/ade/brand.json >/dev/null || { echo "brand.json: name must be a non-empty string"; exit 1; }
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists; builds will upload into it"
            exit 0
          fi
          PREVIOUS="$(git tag --list 'ade-v*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)"
          if [ -n "$PREVIOUS" ]; then
            NOTES="$(bun packages/ade/script/release-plan.ts notes "$PREVIOUS" "$TAG")"
          else
            NOTES="Prima release di $NAME."
          fi
          printf '%s\n' "$NOTES" > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
            --title "$NAME ${TAG#ade-v}" --notes-file notes.md --verify-tag

      # The release that holds the updater's manifest also holds NikVerse's assets (one per file, named `nikverse-<sha256>`), which the builds
      # below put there before this release is public. It is created here, once, and not by the builds that run side by side and would race.
      - name: The updater release
        if: ${{ !inputs.attach_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAME="$(jq -r .name packages/ade/brand.json)"
          if ! gh release view ade-updater --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create ade-updater --repo "$GITHUB_REPOSITORY" --target feat/ade --prerelease --latest=false \
              --title "$NAME updater" --notes "Manifest read by installed copies of $NAME to update themselves. Not a release: see the ade-v* releases."
          fi

  checks:
    needs: draft
    uses: ./.github/workflows/ade-checks.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  build:
    # `checks` gates the build: nothing red is built, let alone released.
    # Upstream let the build run on a red suite (b6b8687d0) because the
    # release's prettier pass rewrote `browser-frame.js` and turned its test red
    # after the tag; `.prettierignore` leaves that file alone, so the reason is
    # gone, and a release on red tests is worse than none.
    needs: [draft, checks]
    env:
      # build.rs bundles NikVerse's 3D city with bun; without this a build that
      # cannot do it warns and ships the plain list, in silence. A release must
      # fail instead (`nikverse/release-env.test.ts` holds this line).
      NIKVERSE_WORLD_REQUIRED: "1"
      # Authenticode signing through SignPath Foundation starts the day its API
      # token is added as a secret; until then the Windows setup ships
      # unsigned, as before. See packages/ade/CODE_SIGNING.md.
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app
          - os: macos-14
            target: x86_64-apple-darwin
            bundles: app
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            # NSIS only. It installs per user into %LOCALAPPDATA%\ADE, where
            # every earlier release is, and a newer setup replaces that copy;
            # an MSI installs per machine into Program Files, beside it, as a
            # second ADE with its own shortcuts.
            bundles: nsis
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libxdo-dev build-essential file rpm

      - uses: ./.github/actions/setup-bun

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/ade/src-tauri -> target
          key: release-${{ matrix.target }}

      # Outside Tauri's beforeBuildCommand, which runs with node_modules/.bin on
      # PATH and can pick up a broken bun shim on Windows (see desktop-release).
      - name: Build frontend
        working-directory: packages/ade
        run: bun x vite build

      # macOS: `app` only. Tauri's dmg step drives Finder through AppleScript
      # and fails on headless runners; the dmg is made with hdiutil below.
      - name: Build app
        working-directory: packages/ade
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.ADE_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.ADE_UPDATER_PRIVATE_KEY_PASSWORD }}
          ATTACH_ONLY: ${{ inputs.attach_only }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.draft.outputs.version }}"
          # A release without updater signatures would strand every installed
          # copy on this version, so a missing key fails the build.
          UPDATER=true
          if [ "$ATTACH_ONLY" = "true" ]; then
            # These are downloadable installers, not an ADE updater release.
            UPDATER=false
          elif [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "secret ADE_UPDATER_PRIVATE_KEY is not set"
            exit 1
          fi
          CONFIG_JSON="{\"version\":\"$VERSION\",\"build\":{\"beforeBuildCommand\":\"\"},\"bundle\":{\"createUpdaterArtifacts\":$UPDATER,\"macOS\":{\"signingIdentity\":\"-\"}}}"
          bun x tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$CONFIG_JSON"

      # NikVerse's assets are not in the installer: the app fetches them the first time the world opens, by the hash its own list carries
      # (`src-tauri/src/nikverse_assets.rs`), from this release. The list was compiled from the folder as it is now, so every file of the
      # folder is put there, named by content and never overwritten: the same file in two versions is one asset, and an older app finds
      # the ones its list names. This runs before `publish` makes the release public, and a file that cannot be put there fails the build:
      # a release whose world cannot be fetched is worse than no release.
      - name: NikVerse assets
        if: ${{ !inputs.attach_only }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DIR=packages/ade/src-tauri/nikverse-assets
          STAGE="$(mktemp -d)"
          digest() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1; else shasum -a 256 "$1" | cut -d' ' -f1; fi; }
          names() { gh release view ade-updater --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'; }
          HAVE="$(names)"
          UPLOADED=0
          # The same files the manifest lists: everything that is not hidden (build.rs skips a name that starts with a dot, folders too).
          while IFS= read -r FILE; do
            HASH="$(digest "$FILE")"
            ASSET="nikverse-$HASH"
            if printf '%s\n' "$HAVE" | grep -qx "$ASSET"; then continue; fi
            cp "$FILE" "$STAGE/$ASSET"
            # No --clobber: an asset is never replaced. Two builds may put the same file at once; then one of the uploads
            # fails and the asset is there all the same, which is what is checked.
            if ! gh release upload ade-updater "$STAGE/$ASSET" --repo "$GITHUB_REPOSITORY"; then
              names | grep -qx "$ASSET" || { echo "could not upload $ASSET ($FILE)"; exit 1; }
            fi
            UPLOADED=$((UPLOADED + 1))
          done < <(find "$DIR" -type f -not -path '*/.*' | sort)
          TOTAL="$(find "$DIR" -type f -not -path '*/.*' | wc -l | tr -d '[:space:]')"
          echo "NikVerse assets: $TOTAL files, $UPLOADED uploaded"
          if [ "$TOTAL" = "0" ]; then echo "no NikVerse assets to upload"; exit 1; fi

      # The setup goes to SignPath, comes back with an Authenticode signature,
      # and replaces the unsigned one. Its updater signature was computed over
      # the unsigned bytes, so it is made again over the signed ones: the app
      # checks the file it downloads against exactly this .sig.
      - name: Upload the Windows setup for signing
        id: unsigned
        if: runner.os == 'Windows' && env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ade-unsigned-${{ matrix.target }}
          path: packages/ade/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Authenticode signing (SignPath)
        if: steps.unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use the signed setup
        if: steps.unsigned.outcome == 'success'
        working-directory: packages/ade
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.ADE_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.ADE_UPDATER_PRIVATE_KEY_PASSWORD }}
          ATTACH_ONLY: ${{ inputs.attach_only }}
        run: |
          set -euo pipefail
          NSIS="src-tauri/target/${{ matrix.target }}/release/bundle/nsis"
          cp ../../signed/*-setup.exe "$NSIS/"
          if [ "$ATTACH_ONLY" != "true" ]; then
            for setup in "$NSIS"/*-setup.exe; do
              rm -f "$setup.sig"
              bun x tauri signer sign "$setup"
            done
          fi

      - name: Collect and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTACH_ONLY: ${{ inputs.attach_only }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.draft.outputs.version }}"
          NAME="$(jq -r .name packages/ade/brand.json)"
          jq -e '.name | type == "string" and length > 0' packages/ade/brand.json >/dev/null || { echo "brand.json: name must be a non-empty string"; exit 1; }
          BUNDLE="packages/ade/src-tauri/target/${{ matrix.target }}/release/bundle"
          STAGE="ade-release"
          mkdir -p "$STAGE"
          case "${{ matrix.target }}" in
            *-apple-darwin)
              ARCH="${{ matrix.target }}"; ARCH="${ARCH%%-*}"
              ditto -c -k --keepParent "$BUNDLE/macos/$NAME.app" "$STAGE/${NAME}_${VERSION}_${ARCH}.app.zip"
              DMGROOT="$(mktemp -d)"
              cp -R "$BUNDLE/macos/$NAME.app" "$DMGROOT/"
              ln -s /Applications "$DMGROOT/Applications"
              hdiutil create -volname "$NAME" -srcfolder "$DMGROOT" -ov -format UDZO "$STAGE/${NAME}_${VERSION}_${ARCH}.dmg"
              # The updater's bundle has no architecture in its name: give it one.
              if [ "$ATTACH_ONLY" != "true" ]; then
                cp "$BUNDLE/macos/$NAME.app.tar.gz" "$STAGE/${NAME}_${VERSION}_${ARCH}.app.tar.gz"
                cp "$BUNDLE/macos/$NAME.app.tar.gz.sig" "$STAGE/${NAME}_${VERSION}_${ARCH}.app.tar.gz.sig"
              fi
              ;;
            *)
              # Installers, plus the signatures of the two the updater installs:
              # the NSIS setup on Windows and the AppImage on Linux.
              find "$BUNDLE" -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.deb" \
                -o -name "*.rpm" -o -name "*.AppImage" -o -name "*-setup.exe.sig" \
                -o -name "*.AppImage.sig" \) -exec cp {} "$STAGE/" \;
              ;;
          esac
          ls -la "$STAGE"
          if [ "$(find "$STAGE" -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" = "0" ]; then
            echo "no bundles produced for ${{ matrix.target }}"
            exit 1
          fi
          find "$STAGE" -maxdepth 1 -type f -exec gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" {} +

  publish:
    needs: build
    if: ${{ !inputs.attach_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: packages/ade/brand.json
          sparse-checkout-cone-mode: false

      # The page a person downloads from says what Windows will say to them,
      # and gives them a way to check the file. Both are written while the
      # release is still a draft, so nobody sees it without them. The Windows
      # paragraph is keyed on the file itself: it goes away only when every
      # Windows installer that was uploaded carries an embedded Authenticode
      # signature, not when a secret happens to be set (see CODE_SIGNING.md).
      # "Carries a signature" is all this checks: the certificate table is
      # there. Whether it is valid, trusted and matches the file is not
      # verified here; SignPath does not produce broken ones, and a real
      # verification needs signtool or osslsigncode. The checksums cover every
      # bundle, the updater's .app.tar.gz included, since the macOS and Linux
      # bundles are not signed either. SHA256SUMS.txt is also an asset.
      - name: Checksums and the warning Windows will show
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p sums && cd sums
          for pattern in '*.exe' '*.msi' '*.dmg' '*.app.zip' '*.app.tar.gz' '*.deb' '*.rpm' '*.AppImage'; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$pattern" || true
          done
          NAME="$(jq -r .name "$GITHUB_WORKSPACE/packages/ade/brand.json")"
          jq -e '.name | type == "string" and length > 0' "$GITHUB_WORKSPACE/packages/ade/brand.json" >/dev/null || { echo "brand.json: name must be a non-empty string"; exit 1; }
          if ! ls "${NAME}"_* >/dev/null 2>&1; then
            echo "no bundles to sum in $TAG"
            exit 1
          fi
          sha256sum "${NAME}"_* > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

          # HAS_SIGNATURE: every Windows installer uploaded (the setup, and an
          # .msi if one is ever published) has a certificate table, data
          # directory 4 of the PE optional header. An unsigned build has none.
          # Presence only, see above; no installer at all counts as unsigned.
          HAS_SIGNATURE=true
          WINDOWS_INSTALLERS=0
          for installer in *-setup.exe *.msi; do
            [ -f "$installer" ] || continue
            WINDOWS_INSTALLERS=$((WINDOWS_INSTALLERS + 1))
            python3 - "$installer" <<'PY' || HAS_SIGNATURE=false
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          pe = struct.unpack_from("<I", data, 0x3C)[0]
          assert data[pe:pe + 4] == b"PE\0\0", "not a PE file"
          optional = pe + 24
          magic = struct.unpack_from("<H", data, optional)[0]
          directories = optional + (112 if magic == 0x20B else 96)
          address, size = struct.unpack_from("<II", data, directories + 4 * 8)
          sys.exit(0 if address and size else 1)
          PY
          done
          [ "$WINDOWS_INSTALLERS" -gt 0 ] || HAS_SIGNATURE=false
          echo "windows installers: $WINDOWS_INSTALLERS, all carrying a signature: $HAS_SIGNATURE"

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md
          {
            printf '\n## Prima di installare\n\n'
            if [ "$HAS_SIGNATURE" != "true" ]; then
              printf '%s\n\n' '**Windows.** Il setup non è ancora firmato, quindi Windows lo ferma con «PC protetto da Windows»: premi *Ulteriori informazioni* e poi *Esegui comunque*. Gli aggiornamenti dall'"'"'app non lo chiedono.'
            fi
            printf '%s\n\n' '**macOS.** L'"'"'app non è notarizzata, quindi la prima apertura viene bloccata («impossibile aprire»). Dopo quel tentativo: *Impostazioni di Sistema → Privacy e sicurezza → Apri comunque*. Su macOS 15 e successivi il tasto destro e *Apri* non basta più. In alternativa, dal Terminale: `xattr -dr com.apple.quarantine /Applications/ADE.app`.'
            printf '%s\n\n' '**Impronte SHA-256** dei file qui sopra, anche in `SHA256SUMS.txt`. Per confrontare un file scaricato: su Windows `certutil -hashfile <file> SHA256`, su macOS e Linux `shasum -a 256 <file>`.'
            printf '```\n'
            cat SHA256SUMS.txt
            printf '```\n'
          } >> notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

      # The copyright's last year is written in brand.json, never read from
      # the clock (a check that goes red on the first of January by itself is
      # worse than none). This is the one moment somebody is looking at a
      # release, so it is where a year left behind gets pointed out: a
      # warning, not a failure.
      - name: Copyright year
        shell: bash
        run: |
          set -euo pipefail
          UNTIL="$(jq -r .until packages/ade/brand.json)"
          YEAR="$(date -u +%Y)"
          if ! [[ "$UNTIL" =~ ^[0-9]{4}$ ]] || [ "$UNTIL" -lt "$YEAR" ]; then
            echo "::warning file=packages/ade/brand.json::copyright runs to $UNTIL and it is $YEAR: raise \"until\" and run bun run brand"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false

      # One entry per platform the updater can install. A platform without a
      # signed bundle (Linux on ARM ships only deb/rpm) is left out, and the
      # app falls back to opening the release page there.
      - name: Updater manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${TAG#ade-v}"
          NAME="$(jq -r .name packages/ade/brand.json)"
          jq -e '.name | type == "string" and length > 0' packages/ade/brand.json >/dev/null || { echo "brand.json: name must be a non-empty string"; exit 1; }
          mkdir -p manifest && cd manifest
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig'
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          entry() {
            if [ ! -f "$2.sig" ]; then echo "no $2.sig: $1 is not in the manifest" >&2; return 0; fi
            jq -n --arg key "$1" --arg url "$BASE/$2" --rawfile sig "$2.sig" \
              '{($key): {url: $url, signature: ($sig | rtrimstr("\n"))}}'
          }
          {
            entry darwin-aarch64 "${NAME}_${VERSION}_aarch64.app.tar.gz"
            entry darwin-x86_64 "${NAME}_${VERSION}_x86_64.app.tar.gz"
            entry windows-x86_64 "${NAME}_${VERSION}_x64-setup.exe"
            entry windows-aarch64 "${NAME}_${VERSION}_arm64-setup.exe"
            entry linux-x86_64 "${NAME}_${VERSION}_amd64.AppImage"
          } > entries.json
          if [ ! -s entries.json ]; then
            echo "no signed bundles in $TAG"
            exit 1
          fi
          jq -s --arg version "$VERSION" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, pub_date: $date, notes: "", platforms: add}' entries.json > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
          if ! gh release view ade-updater --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create ade-updater --repo "$GITHUB_REPOSITORY" --target feat/ade --prerelease --latest=false \
              --title "$NAME updater" --notes "Manifest read by installed copies of $NAME to update themselves. Not a release: see the ade-v* releases."
          fi
          gh release upload ade-updater latest.json --clobber --repo "$GITHUB_REPOSITORY"
