name: "ragu GitHub Action"
description: "Run ragu in GitHub Actions workflows"
branding:
  icon: "code"
  color: "orange"

inputs:
  model:
    description: "Model to use"
    required: true

  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  github_token:
    description: "GitHub token the action comments, pushes and opens PRs with. Defaults to the workflow's GITHUB_TOKEN."
    required: false
    default: "${{ github.token }}"

  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/ragu,/nik'"
    required: false

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ github.action_path }}/../package.json

    - name: Install action dependencies
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/..
      run: bun install --cwd "$ACTION_ROOT" --frozen-lockfile

    - name: Run ragu
      shell: bash
      id: run_ragu
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        PROMPT: ${{ inputs.prompt }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        TOKEN: ${{ inputs.github_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GH_TOKEN: ${{ inputs.github_token }}
      run: bun "$GITHUB_ACTION_PATH/index.ts"
