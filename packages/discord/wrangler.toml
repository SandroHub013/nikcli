name = "ragu-discord"
main = "src/worker.ts"
compatibility_date = "2025-01-25"
compatibility_flags = ["nodejs_compat"]

# The Worker answers on your workers.dev subdomain. To use a domain of yours
# instead, set workers_dev = false and add, for a zone on your account:
#   [[routes]]
#   pattern = "discord.example.com"
#   custom_domain = true
workers_dev = true

[vars]
NODE_ENV = "production"
WRANGLER_LOG_LEVEL = "info"
# RAGU_URL (a secret, below) is required: the Worker has no local agent to fall
# back on. A host running `ragu mobile serve` sets mobileAuthRequired and
# rejects Basic auth outright — it takes only a bearer, so RAGU_TOKEN must be a
# mobile pairing token. RAGU_USERNAME/RAGU_PASSWORD apply only to a plain
# `ragu serve`.
RAGU_USERNAME = "ragu"

# One instance per Discord channel: holds that channel's ragu session id and
# serializes the prompts running against it.
[[durable_objects.bindings]]
name = "CHANNEL_SESSIONS"
class_name = "ChannelSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChannelSession"]

# Secrets to set via `wrangler secret put`:
# - DISCORD_PUBLIC_KEY      # Developer Portal → General Information → Public Key
# - DISCORD_APPLICATION_ID  # Developer Portal → General Information → Application ID
# - RAGU_URL              # your ragu host, e.g. https://ragu.example.com
# - RAGU_TOKEN            # bearer for a `ragu mobile serve` host (see below)
# - RAGU_PASSWORD         # Basic Auth password, for a plain `ragu serve` host
# - DISCORD_ALLOWED_CHANNELS  # optional, comma-separated channel IDs
#
# DISCORD_BOT_TOKEN is not needed by the Worker, only by `bun run register`.
#
# After deploying, set the Interactions Endpoint URL in the Developer Portal to
# https://<your Worker's domain>/discord/interactions and run `bun run register`.
