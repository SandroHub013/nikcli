# Bozza della lezione 5 del percorso «Agenti e LLM»
id: agenti-llm/05-sandbox-allowlist-budget
versione: 1.0.0
lingua: it
tema: agenti-llm
unita: 1
numero: 5
titolo: Sandbox, allowlist e budget
durata_min: 4
livello: 2
prerequisiti:
  - agenti-llm/01-token-contesto
  - agenti-llm/02-ruoli-prompt
  - agenti-llm/03-ciclo-agente
  - agenti-llm/04-iniezione-dati
stato: rivista
autori:
  bozza: agy
  revisione: Architetto

obiettivi:
  - id: O1
    testo: "Spiegare il privilegio minimo: un agente ha solo i permessi che servono al compito."
  - id: O2
    testo: "Distinguere allowlist e denylist, e dire perché la prima è più sicura."
  - id: O3
    testo: "Spiegare che cosa fa una sandbox e che cosa non fa."
  - id: O4
    testo: "Leggere un budget di token, tempo e costi, riconoscendo i modelli gratuiti e i loro limiti."
  - id: O5
    testo: "Riconoscere le azioni che vanno sempre confermate da una persona."

fonti:
  - id: F1
    titolo: "Documentazione ufficiale di Anthropic: controllo degli strumenti e permessi"
    url: https://docs.claude.com
  - id: F3
    titolo: "OWASP Top 10 for LLM Applications: LLM06 Excessive Agency"
    url: https://genai.owasp.org/llm-top-10/
  - id: F6
    titolo: "Documentazione di ragu: pagina dei permessi (allow, ask, deny)"
    url: https://github.com/nikcli/nikcli/blob/live-main/packages/web/src/pages/docs/permissions.astro
  - id: F7
    titolo: "OpenRouter: limiti delle API e dei modelli gratuiti"
    url: https://openrouter.ai/docs/api-reference/limits

teoria:
  - id: T1
    obiettivi: [O1, O2]
    fonti: [F3, F6]
    testo: >-
      Il principio del **privilegio minimo** prevede che l'agente disponga solo delle risorse indispensabili
      al compito contingente. Una **allowlist** (elenco esplicito delle azioni concesse) è più sicura di una
      denylist (elenco dei divieti): una denylist rischia sempre di dimenticare comandi insoliti, mentre la
      allowlist blocca in partenza qualsiasi richiesta non prevista.
  - id: T2
    obiettivi: [O3, O5]
    fonti: [F3, F1]
    testo: >-
      La **sandbox** circoscrive filesystem e rete evitando danni alla macchina ospitante, ma non rende il
      sistema immune da errori logici o consumo di budget. Per le azioni ad alto impatto — cancellazioni,
      invio di credenziali, deploy o pagamenti — l'harness deve richiedere la **conferma esplicita** della
      persona.
  - id: T3
    obiettivi: [O4]
    fonti: [F7, F1]
    testo: >-
      I modelli gratuiti (come quelli `:free`) non costano soldi, ma hanno tetti di richieste, possono
      sparire dal catalogo e i dati possono essere trattati in modo diverso: le condizioni vanno lette con
      attenzione. Fissare un **budget massimo** di token e tempo per turno e per sessione protegge da cicli
      infiniti o spese impreviste.

esercizi:
  - id: l05-e01
    tipo: scelta
    obiettivo: O1
    difficolta: 1
    fonte: F3
    consegna: "Che cosa prescrive il principio del privilegio minimo per un agente software?"
    opzioni:
      - "Concedere all'agente tutti i permessi disponibili per non interrompere mai l'esecuzione"
      - "Assegnare all'agente soltanto i permessi e gli strumenti strettamente necessari al singolo compito"
      - "Rimuovere qualunque tipo di permesso, impedendo persino la lettura del prompt"
    giusta: 1
    spiegazione: >-
      Limitare i permessi riduce il raggio d'azione dell'agente: in caso di errori o iniezioni, i danni
      potenziali rimangono circoscritti.
    sbagliate:
      - risposta: 0
        perche: "Concedere pieni poteri espone l'intero sistema se il modello riceve istruzioni ingannevoli o compie errori."
      - risposta: 2
        perche: "Senza i permessi minimi essenziali l'agente non potrebbe accedere ai file necessari per svolgere il lavoro."

  - id: l05-e02
    tipo: completa
    obiettivo: O1
    difficolta: 2
    fonte: F6
    consegna: "Completa la frase sul principio del privilegio minimo."
    testo: "Un agente deve ricevere solo i permessi [[1]] al compito, evitando l'accesso a risorse [[2]]."
    banca: ["strettamente necessari", "non richieste", "infiniti", "a pagamento", "casuali"]
    giusta: ["strettamente necessari", "non richieste"]
    spiegazione: >-
      Fornire solo gli accessi indispensabili impedisce che un'azione errata o deviata tocchi file e servizi
      estranei al compito.
    sbagliate:
      - risposta: ["infiniti", "non richieste"]
        perche: "Attribuire permessi illimitati è l'opposto del privilegio minimo e moltiplica i pericoli."
      - risposta: ["strettamente necessari", "a pagamento"]
        perche: "Il privilegio minimo limita l'accesso a qualunque risorsa non pertinente, sia essa gratuita o a pagamento."

  - id: l05-e03
    tipo: scelta
    obiettivo: O2
    difficolta: 2
    fonte: F6
    consegna: "Perché una allowlist è intrinsecamente più sicura di una denylist per filtrare i comandi?"
    opzioni:
      - "Perché blocca a priori tutto ciò che non è esplicitamente autorizzato, evitando dimenticanze"
      - "Perché una allowlist è più corta da scrivere rispetto a una denylist"
      - "Perché una denylist rischia di bloccare anche comandi utili non previsti"
    giusta: 0
    spiegazione: >-
      In una denylist basta omettere un singolo comando o alias per lasciare aperta una breccia; la
      allowlist ammette unicamente ciò che è esplicitamente approvato.
    sbagliate:
      - risposta: 1
        perche: "Una allowlist è spesso più lunga da redigere; il vantaggio di sicurezza non risiede nella brevità, ma nel blocco predefinito."
      - risposta: 2
        perche: "Questo è il rischio tipico di una allowlist troppo restrittiva, mentre una denylist rischia di lasciar passare comandi pericolosi non previsti."

  - id: l05-e04
    tipo: trova-riga
    obiettivo: O2
    difficolta: 2
    fonte: F6
    consegna: "In questa configurazione di permessi per l'agente, quale riga è eccessivamente permissiva?"
    etichetta: "permessi-agente.yaml"
    righe:
      - "agente: manutenzione-documenti"
      - "rete.allow: ['api.documenti.isola.test']"
      - "filesystem.read: ['src/docs/', 'README.md']"
      - "filesystem.write: ['*']"
      - "terminale.allow: ['git status', 'git diff']"
    giuste: [3]
    spiegazione: >-
      La riga di scrittura con asterisco concede libertà totale di modifica o cancellazione su qualunque
      file, violando il principio di confinamento.
    sbagliate:
      - risposta: 1
        perche: "La regola di rete vincola strettamente le connessioni a un unico endpoint atteso."
      - risposta: 2
        perche: "L'accesso in lettura è circoscritto ai soli percorsi della documentazione."

  - id: l05-e05
    tipo: scelta
    obiettivo: O3
    difficolta: 1
    fonte: F3
    consegna: "Che cosa fa concretamente una sandbox quando viene eseguito uno strumento?"
    opzioni:
      - "Impedisce all'agente di generare comandi errati o con bug"
      - "Concede all'agente la facoltà di modificare i file protetti del sistema operativo"
      - "Separa l'esecuzione dal sistema host, limitando l'accesso a filesystem, porte e processi esterni"
    giusta: 2
    spiegazione: >-
      La sandbox isola i comandi in un ambiente controllato, impedendo alterazioni non autorizzate delle
      risorse della macchina ospitante.
    sbagliate:
      - risposta: 0
        perche: "La sandbox confina gli effetti dell'esecuzione sul sistema host, ma non corregge bug né impedisce errori logici nei comandi."
      - risposta: 1
        perche: "La sandbox fa esattamente il contrario: isola e protegge i file di sistema impedendone la manipolazione non concordata."

  - id: l05-e06
    tipo: completa
    obiettivo: O3
    difficolta: 2
    fonte: F3
    consegna: "Completa la frase sui limiti della sandbox."
    testo: "La sandbox confina l'ambiente locale, ma non rende l'agente [[1]] contro iniezioni logiche o consumo eccessivo di [[2]]."
    banca: ["immune", "budget", "lento", "visibile", "gratuito"]
    giusta: ["immune", "budget"]
    spiegazione: >-
      Confinare i comandi impedisce danni al sistema operativo, ma non elimina il rischio di comportamenti
      imprevisti o di esaurimento dei token allocati.
    sbagliate:
      - risposta: ["visibile", "budget"]
        perche: "La sandbox non altera la visibilità dell'agente, ma ne isola l'ambiente operativo."
      - risposta: ["immune", "gratuito"]
        perche: "Il consumo riguarda il budget complessivo delle risorse impegnate nella sessione."

  - id: l05-e07
    tipo: trova-riga
    obiettivo: O4
    difficolta: 2
    consegna: "Il limite massimo per turno è 4.000 token totali. Quale turno ha superato la soglia prevista?"
    etichetta: "registro-turni.log"
    righe:
      - "[turno 1] prompt: 800 token, risposta: 250 token, totale: 1050 token"
      - "[turno 2] prompt: 3500 token, risposta: 450 token, totale: 3950 token"
      - "[turno 3] prompt: 1200 token, risposta: 2900 token, totale: 4100 token"
      - "[turno 4] prompt: 2100 token, risposta: 400 token, totale: 2500 token"
      - "[turno 5] prompt: 1900 token, risposta: 300 token, totale: 2200 token"
    giuste: [2]
    spiegazione: >-
      Il turno 3 ha raggiunto 4.100 token totali a causa di una risposta particolarmente estesa, superando
      il budget massimo di 4.000 token per turno.
    sbagliate:
      - risposta: 1
        perche: "Il turno 2 si ferma a 3.950 token totali: è un consumo elevato ma rimane entro la soglia consentita."
      - risposta: 3
        perche: "Il turno 4 ha consumato 2.500 token totali, rimanendo ampiamente sotto il tetto stabilito."

  - id: l05-e08
    tipo: ordina
    obiettivo: O4
    difficolta: 2
    fonte: F6
    consegna: "Metti in ordine la sequenza di gestione del budget durante una sessione."
    elementi:
      - "Configurazione del tetto massimo di token e costo per la sessione"
      - "Avvio del ciclo operativo con monitoraggio dei consumi a ogni turno"
      - "Rilevamento del superamento della soglia di sicurezza prestabilita"
      - "Sospensione automatica delle ulteriori chiamate da parte dell'harness"
      - "Notifica alla persona con riepilogo delle risorse utilizzate"
    spiegazione: >-
      Un controllo efficace definisce prima i limiti, traccia i consumi ed arresta il processo in tempo
      reale prima di eccedere il budget.
    sbagliate:
      - risposta: [1, 0, 2, 3, 4]
        perche: "I limiti di budget vanno dichiarati prima dell'inizio delle operazioni, non dopo averle avviate."
      - risposta: [0, 1, 3, 2, 4]
        perche: "La sospensione viene attivata solo quando l'harness intercetta l'avvicinamento o il superamento della soglia."

  - id: l05-e09
    tipo: abbina
    obiettivo: O5
    difficolta: 1
    fonte: F6
    consegna: "Abbina ciascuna operazione alla modalità di autorizzazione corretta."
    coppie:
      - sinistra: "Cancellare un database o eliminare branch remoti"
        destra: "azione irreversibile sui dati: conferma esplicita della persona"
      - sinistra: "Leggere un file sorgente nella cartella di lavoro"
        destra: "consultazione non distruttiva: consentita da allowlist locale"
      - sinistra: "Inviare un pagamento o un ordine di acquisto online"
        destra: "transazione finanziaria diretta: approvazione umana necessaria"
      - sinistra: "Eseguire la suite di test unitari in locale"
        destra: "verifica in ambiente isolato: esecuzione permessa dalla policy"
    spiegazione: >-
      Tutte le azioni irreversibili, distruttive o con riflessi finanziari pretendono la validazione di una
      persona reale.
    sbagliate:
      - risposta:
          sinistra: "Cancellare un database o eliminare branch remoti"
          destra: "verifica in ambiente isolato: esecuzione permessa dalla policy"
        perche: "La distruzione di archivi o branch è un'azione non ripristinabile che esige approvazione esplicita."
      - risposta:
          sinistra: "Leggere un file sorgente nella cartella di lavoro"
          destra: "azione irreversibile sui dati: conferma esplicita della persona"
        perche: "La consultazione di file di lavoro previsti può procedere automaticamente secondo la allowlist."

  - id: l05-e10
    tipo: abbina
    obiettivo: O5
    difficolta: 2
    fonte: F3
    consegna: "Abbina ogni azione sensibile alla ragione per cui la supervisione umana è indispensabile."
    coppie:
      - sinistra: "Pubblicare codice su un repository pubblico"
        destra: "previene la divulgazione involontaria di chiavi o dati privati"
      - sinistra: "Rimuovere la directory dei backup di sicurezza"
        destra: "impedisce la perdita permanente e irreversibile di informazioni"
      - sinistra: "Disabilitare le regole del firewall locale"
        destra: "evita l'apertura non autorizzata del sistema verso la rete"
      - sinistra: "Acquistare crediti su una piattaforma esterna"
        destra: "impedisce addebiti economici non pianificati sul conto"
    spiegazione: >-
      La persona deve intervenire come presidio di sicurezza quando sono in gioco riservatezza, integrità o
      costi economici diretti.
    sbagliate:
      - risposta:
          sinistra: "Pubblicare codice su un repository pubblico"
          destra: "impedisce la perdita permanente e irreversibile di informazioni"
        perche: "La pubblicazione lede la riservatezza delle credenziali, non causa la distruzione dei dati sorgente."
      - risposta:
          sinistra: "Rimuovere la directory dei backup di sicurezza"
          destra: "previene la divulgazione involontaria di chiavi o dati privati"
        perche: "Eliminare copie di riserva compromette l'integrità e la disponibilità, non la riservatezza verso terzi."

# Dubbi e verifiche:
# - Aggiornata F6 con l'URL ufficiale della documentazione permessi di ragu su GitHub.
# - Aggiunta F7 per i limiti dei modelli gratuiti (:free) da documentazione OpenRouter.
