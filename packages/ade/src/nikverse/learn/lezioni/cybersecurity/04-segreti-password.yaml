id: cybersecurity/04-segreti-password
versione: 1.0.0
lingua: it
tema: cybersecurity
unita: 1
numero: 4
titolo: "Segreti e password"
durata_min: 4
livello: 2
prerequisiti:
  - cybersecurity/03-autorizzazione
stato: rivista
autori:
  bozza: agy
  revisione: Architetto

obiettivi:
  - id: O1
    testo: "Riconoscere l'esposizione errata di credenziali e segreti nel codice sorgente, nei log o nel contesto dei prompt."
  - id: O2
    testo: "Spiegare la corretta conservazione dei segreti tramite variabili d'ambiente o gestori protetti esterni al repository."
  - id: O3
    testo: "Descrivere la procedura di revoca e rotazione immediata necessaria quando un segreto risulta trapelato in un commit."
  - id: O4
    testo: "Spiegare perché le password vanno salvate esclusivamente tramite funzioni di hash lente con sale dedicate."
  - id: O5
    testo: "Illustrare le linee guida moderne su lunghezza minima e controllo preventivo contro archivi di password trapelate."

fonti:
  - id: F1
    titolo: "OWASP Top 10"
    url: "https://owasp.org/Top10/"
  - id: F8
    titolo: "OWASP Cheat Sheet, Secrets Management"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
  - id: F9
    titolo: "OWASP Cheat Sheet, Password Storage"
    url: "https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"
  - id: F10
    titolo: "NIST SP 800-63B"
    url: "https://pages.nist.gov/800-63-4/sp800-63b.html"

teoria:
  - id: T1
    obiettivi: [O1, O2, O3]
    fonti: [F1, F8]
    testo: >-
      Un segreto (chiave API o token) non deve mai trovarsi nel codice, nei file tracciati da git, nei log o
      nei prompt per gli agenti. I segreti vanno custoditi in **variabili d'ambiente** o in un **gestore di
      segreti** separato dal repository. Se un segreto finisce in un commit, cancellarlo con una modifica
      successiva non basta perché resta nella cronologia: l'unica misura sicura è **revocarlo e sostituirlo**
      immediatamente.
  - id: T2
    obiettivi: [O4]
    fonti: [F9]
    testo: >-
      Le password non si salvano mai in chiaro né con algoritmi reversibili: si conservano tramite **funzioni di
      hash lente con sale** (come Argon2id o bcrypt), create appositamente per contrastare attacchi di forza
      bruta. Gli algoritmi di hash veloci generici (come MD5 o SHA-256) sono inadatti: un computer può calcolare
      miliardi di tentativi al secondo, rendendo banale indovinare le parole memorizzate senza una funzione lenta
      e salata.
  - id: T3
    obiettivi: [O5]
    fonti: [F10]
    testo: >-
      Secondo le linee guida NIST SP 800-63B, la robustezza delle password dipende soprattutto dalla
      **lunghezza** (meglio una frase lunga) e dal controllo preventivo contro elenchi di **password già
      trapelate**. Imporre requisiti rigidi su simboli obbligatori o scadenze mensili induce le persone a
      scegliere schemi prevedibili, riducendo la sicurezza anziché aumentarla.

esercizi:
  - id: l04-e01
    tipo: trova-riga
    obiettivo: O1
    difficolta: 1
    fonte: F8
    consegna: "In questa classe per le previsioni meteo del porto, quale riga definisce una chiave segreta direttamente nel codice sorgente?"
    etichetta: "client-meteo.ts"
    righe:
      - "export class ClientMeteo {"
      - "  private endpoint = 'https://meteo.isola.test/api';"
      - "  private apiKey = 'segreto-finto-isola-meteo-492';"
      - "  async ottieniPrevisioni(localita: string) {"
      - "    return fetch(this.endpoint + '?chiave=' + this.apiKey);"
      - "  }"
      - "}"
    giuste: [2]
    spiegazione: >-
      La riga con `private apiKey` contiene la chiave cablata nel codice. Se il file viene salvato nel
      repository, chiunque abbia accesso al sorgente potrà leggerla. La correzione è leggere la chiave da
      variabili d'ambiente come `process.env.CHIAVE_METEO`.
    sbagliate:
      - risposta: 1
        perche: "La riga con `private endpoint` definisce l'URL pubblico dell'endpoint del servizio, che non è un dato segreto."
      - risposta: 4
        perche: "La riga con `return fetch` esegue la chiamata HTTP: il difetto di sicurezza risiede nella chiave cablata nel codice."

  - id: l04-e02
    tipo: trova-riga
    obiettivo: O1
    difficolta: 2
    fonte: F8
    consegna: "In questo middleware di diagnostica, quale riga stampa le intestazioni complete della richiesta rischiando di esporre token e cookie?"
    etichetta: "logger-accessi.ts"
    righe:
      - "app.use((req, res, next) => {"
      - "  const timestamp = new Date().toISOString();"
      - "  console.log('[RICHIESTA]', timestamp, req.method, req.url, req.headers);"
      - "  next();"
      - "});"
    giuste: [2]
    spiegazione: >-
      La riga con `console.log` registra `req.headers` nei log di sistema, esponendo intestazioni sensibili come
      Cookie o Authorization. La correzione è registrare solo i campi non riservati, come metodo e percorso.
    sbagliate:
      - risposta: 1
        perche: "La riga con `const timestamp` genera la data e l'ora correnti per la marcatura temporale dell'evento."
      - risposta: 3
        perche: "La riga con `next()` inoltra l'elaborazione al middleware successivo della catena applicativa."

  - id: l04-e03
    tipo: trova-riga
    obiettivo: O4
    difficolta: 2
    fonte: F9
    consegna: "In questa funzione di registrazione utente, quale riga usa un hash veloce inadatto per la conservazione sicura delle password?"
    etichetta: "autenticazione-utenti.ts"
    righe:
      - "import crypto from 'node:crypto';"
      - "export function salvaPassword(password: string) {"
      - "  const hash = crypto.createHash('sha256').update(password).digest('hex');"
      - "  return db.utenti.salva({ hashPassword: hash });"
      - "}"
    giuste: [2]
    spiegazione: >-
      La riga con `crypto.createHash('sha256')` usa SHA-256 senza sale: è un algoritmo veloce progettato per
      l'integrità dei dati, non per le password. La correzione raccomandata da F9 è usare funzioni lente
      specifiche con sale come Argon2id o bcrypt.
    sbagliate:
      - risposta: 0
        perche: "La riga con `import crypto` importa il modulo crittografico nativo della piattaforma."
      - risposta: 3
        perche: "La riga con `return db.utenti.salva` memorizza il valore calcolato sul database: l'errore risiede nell'algoritmo di hash impiegato."

  - id: l04-e04
    tipo: ordina
    obiettivo: O3
    difficolta: 1
    fonte: F8
    consegna: "Metti in ordine i passi corretti da compiere quando una chiave segreta viene committata per errore nel repository."
    elementi:
      - "Revocare immediatamente la chiave presso il fornitore del servizio"
      - "Generare una nuova chiave segreta alternativa"
      - "Inserire il nuovo valore nelle variabili d'ambiente di produzione"
      - "Rimuovere il codice compromesso e bonificare la cronologia dei commit"
    spiegazione: >-
      La prima azione irrinunciabile è la revoca immediata della credenziale compromessa; solo dopo si genera un
      nuovo segreto, lo si configura in produzione e si ripulisce il repository.
    sbagliate:
      - risposta: [3, 0, 1, 2]
        perche: "Prima di ripulire git occorre revocare la chiave: chiunque l'abbia copiata potrebbe usarla mentre modifichi il repository."
      - risposta: [2, 1, 0, 3]
        perche: "Non puoi inserire il nuovo valore nelle variabili d'ambiente prima di aver generato la nuova chiave segreta."

  - id: l04-e05
    tipo: ordina
    obiettivo: O4
    difficolta: 2
    fonte: F9
    consegna: "Metti in ordine i passaggi con cui il server verifica la password durante l'accesso."
    elementi:
      - "Ricezione della password digitata dall'utente nel modulo di accesso"
      - "Recupero dal database del valore di hash e del relativo sale associati all'account"
      - "Calcolo del nuovo hash usando la password inserita e il sale recuperato"
      - "Confronto a tempo costante tra l'hash ricalcolato e quello memorizzato"
    spiegazione: >-
      Si riceve la password, si recupera il sale specifico dell'utente, si applica la funzione di hash lenta e
      si confronta il risultato a tempo costante per evitare attacchi di temporizzazione.
    sbagliate:
      - risposta: [0, 2, 1, 3]
        perche: "Non si può calcolare l'hash con il sale senza prima aver recuperato il sale corrispondente dal database."
      - risposta: [1, 0, 2, 3]
        perche: "Il recupero dal database avviene dopo aver identificato l'utente che tenta l'accesso."

  - id: l04-e06
    tipo: abbina
    obiettivo: O2
    difficolta: 1
    fonte: F8
    consegna: "Abbina ogni collocazione di un segreto al giudizio di sicurezza corrispondente."
    coppie:
      - sinistra: "variabile d'ambiente del server di produzione"
        destra: "collocazione corretta: separata dal codice e non presente nel versionamento"
      - sinistra: "file config.json committato nel repository pubblico"
        destra: "da evitare assolutamente: chiunque acceda al repository può leggere il segreto"
      - sinistra: "gestore di segreti protetto con controllo degli accessi"
        destra: "collocazione eccellente: permette rotazione centralizzata e tracciamento degli accessi"
    spiegazione: >-
      I segreti devono risiedere fuori dai file tracciati dal controllo di versione: variabili d'ambiente e
      gestori protetti assicurano riservatezza e controllo.
    sbagliate:
      - risposta:
          sinistra: "variabile d'ambiente del server di produzione"
          destra: "da evitare assolutamente: chiunque acceda al repository può leggere il segreto"
        perche: "Le variabili d'ambiente sono una pratica standard e raccomandata per separare i segreti dal codice."
      - risposta:
          sinistra: "file config.json committato nel repository pubblico"
          destra: "collocazione corretta: separata dal codice e non presente nel versionamento"
        perche: "Un file salvato nel repository espone pubblicamente le credenziali a chiunque navighi il codice."

  - id: l04-e07
    tipo: scelta
    obiettivo: O3
    difficolta: 1
    fonte: F8
    consegna: "Uno sviluppatore nota che una chiave è finita in un commit di ieri. Aggiunge subito il file a .gitignore in un nuovo commit. Perché non basta?"
    opzioni:
      - "Perché il segreto resta leggibile nella cronologia dei commit precedenti di git"
      - "Perché il file .gitignore funziona unicamente sui sistemi operativi Linux"
      - "Perché i certificati digitali disattivano automaticamente la protezione di git"
      - "Perché il comando cancella automaticamente tutti i backup locali dell'archivio"
    giusta: 0
    spiegazione: >-
      Git conserva l'intera sequenza storica delle modifiche: anche se il file è escluso nei commit futuri, la
      chiave resta perfettamente consultabile nei commit storici finché non viene revocata.
    sbagliate:
      - risposta: 1
        perche: "Il meccanismo di esclusione di git funziona in modo identico su qualsiasi sistema operativo."
      - risposta: 2
        perche: "I certificati digitali per il trasporto non hanno alcuna influenza sulla memorizzazione dei commit."
      - risposta: 3
        perche: "Il file .gitignore impedisce solo il tracciamento di nuovi file e non altera i backup esistenti."

  - id: l04-e08
    tipo: scelta
    obiettivo: O5
    difficolta: 2
    fonte: F10
    consegna: "Secondo le raccomandazioni moderne (NIST SP 800-63B), quale regola favorisce maggiormente la robustezza delle password?"
    opzioni:
      - "Obbligare gli utenti a cambiare password ogni trenta giorni in modo inderogabile"
      - "Imporre l'uso obbligatorio di almeno quattro simboli di punteggiatura diversi"
      - "Privilegiare la lunghezza della password e verificare che non compaia in elenchi di credenziali già trapelate"
      - "Vietare l'uso di parole composte da più di sei lettere consecutive"
    giusta: 2
    spiegazione: >-
      La lunghezza garantisce elevata entropia e il blocco delle password trapelate impedisce credenziali
      vulnerabili; imporre cambi frequenti o simboli strani induce invece schemi banali.
    sbagliate:
      - risposta: 0
        perche: "La rotazione forzata periodica incentiva modifiche minime e prevedibili (come cambiare un solo numero)."
      - risposta: 1
        perche: "I vincoli rigidi su simboli non aumentano la sicurezza effettiva quanto l'adozione di frasi lunghe."
      - risposta: 3
        perche: "Le parole lunghe o le pass-phrase composte da più vocaboli sono espressamente raccomandate per la sicurezza."

  - id: l04-e09
    tipo: scelta
    obiettivo: O2
    difficolta: 2
    fonte: F8
    consegna: "Perché inserire una chiave segreta direttamente nel prompt di un agente software è una prassi pericolosa?"
    opzioni:
      - "Perché i modelli linguistici consumano troppa memoria se ricevono lettere maiuscole"
      - "Perché il segreto entra nel contesto e può essere esfiltrato se l'agente incontra istruzioni malevole"
      - "Perché le chiavi API funzionano solo se trasmesse tramite cavo seriale dedicato"
      - "Perché il modello rifiuta di generare risposte per richieste contenenti sequenze di numeri"
    giusta: 1
    spiegazione: >-
      Tutto ciò che viaggia nel contesto del modello è accessibile all'agente: un'iniezione di istruzioni
      presente in un documento analizzato potrebbe indurlo a trasmettere il segreto a un server esterno.
    sbagliate:
      - risposta: 0
        perche: "La presenza di caratteri maiuscoli non influisce sulla gestione della memoria del modello."
      - risposta: 2
        perche: "Le chiavi API sono normali stringhe di autenticazione trasmesse tramite protocollo HTTP."
      - risposta: 3
        perche: "I modelli linguistici elaborano sequenze numeriche senza alcun blocco operativo intrinseco."

  - id: l04-e10
    tipo: completa
    obiettivo: O4
    difficolta: 1
    fonte: F9
    consegna: "Completa la frase."
    testo: "Le password non devono essere conservate in chiaro né cifrate, ma protette tramite una funzione di [[1]] lenta con [[2]]."
    banca: ["hash", "sale", "chiave", "lettura", "rotazione"]
    giusta: ["hash", "sale"]
    spiegazione: >-
      Una funzione di hash lenta unidirezionale combinata con un sale univoco rende gli attacchi con dizionari
      precalcolati estremamente lenti e inefficaci.
    sbagliate:
      - risposta: ["chiave", "sale"]
        perche: "Non si usano algoritmi a chiave reversibili ma funzioni crittografiche di hash a senso unico."
      - risposta: ["hash", "rotazione"]
        perche: "La protezione fondamentale dell'algoritmo richiede l'aggiunta di un sale casuale per ogni utente."

  - id: l04-e11
    tipo: completa
    obiettivo: O5
    difficolta: 2
    fonte: F10
    consegna: "Completa la frase."
    testo: "Per proteggere gli accessi, le linee guida attuali consigliano di privilegiare la [[1]] e bloccare le password già [[2]] in violazioni note."
    banca: ["lunghezza", "trapelate", "complessità", "cifrate", "chiuse"]
    giusta: ["lunghezza", "trapelate"]
    spiegazione: >-
      Frasi lunghe garantiscono un elevato spazio di ricerca contro la forza bruta, mentre il controllo contro
      elenchi di fughe di dati impedisce l'uso di credenziali già note.
    sbagliate:
      - risposta: ["complessità", "trapelate"]
        perche: "Le regole artificiali di complessità (simboli forzati) si sono rivelate meno efficaci della reale lunghezza."
      - risposta: ["lunghezza", "cifrate"]
        perche: "Il controllo preventivo riguarda le password trapelate in precedenti incidenti di sicurezza."

# Dubbi e note:
# - Rispettate le regole di sicurezza: nessun segreto vero (usato 'segreto-finto-isola-meteo-492').
# - Cose da non dire: nessuna menzione a 'criptare le password' (usato solo 'hash lento con sale').
# - Presenti 3 trova-riga su codice (chiave hardcoded, logging degli headers, hash veloce sha256).
# - Fonti usate: F1 (OWASP Top 10), F8 (Secrets Management), F9 (Password Storage), F10 (NIST SP 800-63B).
