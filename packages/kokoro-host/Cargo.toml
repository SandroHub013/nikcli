[package]
name = "kokoro-host"
version = "0.1.0"
edition = "2021"
description = "Kokoro offline TTS as a process of its own, spoken to over JSON lines"
license = "GPL-3.0-or-later"
repository = "https://github.com/SandroHub013/nikcli"
publish = false

# Its own workspace, on purpose. Nothing under src-tauri names this crate, this
# crate names nothing here, and an empty [workspace] stops `cargo` from picking
# a workspace up by walking out of the directory.
[workspace]

[dependencies]
serde_json = "1"
