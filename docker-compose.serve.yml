services:
  ragu-serve:
    build:
      context: .
      dockerfile: Dockerfile.serve
    ports:
      - "4096:4096"
      - "2222:2222"
    environment:
      - RAGU_SERVER_SSH_ENABLED=true
      - RAGU_SERVER_TAILSCALE_AUTH=${RAGU_SERVER_TAILSCALE_AUTH:-false}
      - PORT=4096
    volumes:
      - ragu-data:/data
      - /Users/nikoemme/.local/share/nikcli/auth.json:/data/ragu/auth.json:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4096/global/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  discord-bot:
    build:
      context: .
      dockerfile: packages/discord/Dockerfile
    env_file:
      - packages/discord/.env
    environment:
      # Always points to the ragu-serve container on the internal Docker network
      - RAGU_URL=http://ragu-serve:4096
    depends_on:
      ragu-serve:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  ragu-data:
